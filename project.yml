name: Lepora
options:
  bundleIdPrefix: com.leo
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Lepora
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Lepora:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: Lepora
        excludes:
          - Resources/EditorBundle
      - path: Lepora/Resources/EditorBundle
        type: folder
        buildPhase: resources
    info:
      path: Lepora/Info.plist
      properties:
        CFBundleDisplayName: Lepora
        CFBundleName: Lepora
        CFBundleIdentifier: com.leo.lepora
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Leo. All rights reserved."
        NSSupportsAutomaticGraphicsSwitching: true
        CFBundleIconFile: AppIcon
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
              - public.plain-text
            CFBundleTypeExtensions:
              - md
              - markdown
              - mdown
              - mkd
              - mkdn
              - mdwn
              - mdtxt
              - mdtext
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
                - mdown
                - mkd
    entitlements:
      path: Lepora/Lepora.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Lepora/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.leo.lepora
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
